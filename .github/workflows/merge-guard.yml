# RFC-0001 §Conflicts of interest rule 2 (INV-GOV-4): a change to a system's files is not
# approved only by maintainers who declared an interest in that system. The signal is the
# pull request's latest approvals; the merge actor is not known before the merge.
name: merge-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  merge-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: approvals against MAINTAINERS.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          approved=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json latestReviews \
            --jq '[.latestReviews[] | select(.state == "APPROVED") | .author.login] | join(",")')
          uv run python -m iproofs.validate.merge_guard --base "origin/$BASE" --approved "$approved"
      - name: wall time to the job summary
        if: always()
        run: |
          echo "merge-guard: $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 5 min)" >> "$GITHUB_STEP_SUMMARY"
