name: nightly

# RFC-0013 §CI workflow structure: the tree gates on the whole tree every night, and the
# external link check (G12) weekly. Neither blocks a merge.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Full history: CRIT-8 reads the commits the criteria file quotes (RFC-0016), and an absent
    # commit is never a pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run iproofs validate --all

  external-links:
    # Weekly (Monday cron) or by hand; opens an issue when a link fails, so it alone may write issues.
    if: github.event.schedule == '17 4 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: fetch every external link (G12)
        id: links
        run: uv run python -m iproofs.validate.links --external > "$RUNNER_TEMP/links.txt"
      - name: open an issue listing the failures
        if: failure() && steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly external link check (RFC-0013 §G12) found links that did not resolve:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/links.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "External links failing ($(date -u +%F))" --body-file "$RUNNER_TEMP/body.md"
