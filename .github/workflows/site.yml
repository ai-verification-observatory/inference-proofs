# The public site, web/. Vercel deploys it to www.inferenceproofs.ai on every commit to
# main that changes this folder (web/vercel.json: ignoreCommand). It serves the pages
# as committed, so this check holds them to what build.py writes from _data/: a pull request whose
# pages are stale, whose sort keys fail their test, or whose preview pictures were not rendered
# from their committed sources (og/cards.json), does not pass. No secrets, no upload.
name: site

on:
  pull_request:
    paths: ["web/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  built:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the build and its tests
        working-directory: web
        run: |
          python3 --version
          python3 -I build.py
          python3 -I test_sort_keys.py
          python3 -I test_cards.py
          python3 -I test_search.py
      - name: the committed files are the built files (new files included)
        run: |
          git status --porcelain -- web
          test -z "$(git status --porcelain -- web)"
