# RFC-0013 §CI workflow structure. Each job's hard timeout is twice its docs/spec/08 target,
# and each job writes its wall time to the job summary.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # twice its target (docs/spec/08 §When a budget is exceeded)
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict harness/src/iproofs harness/tests
      - name: wall time to the job summary
        if: always()
        run: |
          echo "lint-and-types: $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 20 min, twice B-CI-TOTAL, 10 min; no gate-specific target)" >> "$GITHUB_STEP_SUMMARY"

  test-shard:
    # The suite runs in SHARDS parts (docs/spec/07 §Sharding); every test runs in exactly one.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3, 4, 5, 6]
    env:
      HYPOTHESIS_PROFILE: ci
      IPROOFS_SHARD: ${{ matrix.shard }}/6
      COVERAGE_FILE: .coverage.${{ matrix.python }}-${{ matrix.shard }}
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run pytest harness/tests systems -q -n auto --dist loadfile --durations=20 --cov=iproofs --cov-report=
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.python }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: wall time to the job summary
        if: always()
        run: |
          echo "test-shard (Python ${{ matrix.python }}, ${{ matrix.shard }}/6): $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 6 min, twice B-CI-UNIT, 3 min)" >> "$GITHUB_STEP_SUMMARY"

  tests:
    # Required check names `tests (3.12)` and `tests (3.13)`: passes only when every shard of
    # that Python passed and the combined coverage meets its floors.
    needs: test-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 6  # twice its target (docs/spec/08 §When a budget is exceeded)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-${{ matrix.python }}-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage json -o coverage.json
      - run: uv run python harness/tests/coverage_gate.py coverage.json
      - name: CLI cold start (budget B-CLI-START, 500 ms target)
        run: |
          start=$(date +%s%N)
          .venv/bin/iproofs --help > /dev/null
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "iproofs --help cold start on Python ${{ matrix.python }}: ${ms} ms (budget B-CLI-START: 500 ms, a target)" >> "$GITHUB_STEP_SUMMARY"
      - name: wall time to the job summary
        if: always()
        run: |
          echo "tests (Python ${{ matrix.python }}): $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04 for the combine step, one run (hard limit 6 min, twice B-CI-UNIT, 3 min)" >> "$GITHUB_STEP_SUMMARY"

  validate:
    # Gates G2 to G5 (RFC-0013); APP-1 needs the base branch, so history is fetched in full.
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # twice its target (docs/spec/08 §When a budget is exceeded)
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install
      - run: uv sync --frozen
      - run: uv run iproofs validate --all
      - name: append-only check against the base branch (APP-1)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            uv run iproofs validate --all --changed-since "origin/${{ github.base_ref }}"
          fi
      - name: tooling budgets on the synthetic tree (default branch, docs/spec/08)
        if: github.event_name == 'push'
        run: IPROOFS_BENCH=1 IPROOFS_BENCH_SUMMARY="$GITHUB_STEP_SUMMARY" uv run pytest harness/tests/bench -q
      - name: wall time to the job summary
        if: always()
        run: |
          echo "validate: $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 20 min, twice B-CI-TOTAL, 10 min; B-VAL-TREE is benchmarked below)" >> "$GITHUB_STEP_SUMMARY"

  dco:
    # Gate G11 (RFC-0013): every commit of the pull request signed off by its author.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # twice its target (docs/spec/08 §When a budget is exceeded)
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: DCO-1 over the pull request's commits
        run: |
          range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          uv run python -m iproofs.validate.dco "$range"
      - name: wall time to the job summary
        if: always()
        run: |
          echo "dco: $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 20 min, twice B-CI-TOTAL, 10 min; no gate-specific target)" >> "$GITHUB_STEP_SUMMARY"

  fake-e2e:
    # Gate G10 (RFC-0013): the fake systems end to end in real containers, CPU only. The
    # harness runs as root so it can give each job io dir to the adapter uid (RFC-0005).
    runs-on: ubuntu-24.04
    timeout-minutes: 4  # twice its target (docs/spec/08 §When a budget is exceeded)
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: fake and fake-broken end to end (E2E-1, budget B-CI-E2E 120 s target)
        env:
          IPROOFS_REAL_DOCKER: "1"
        run: |
          start=$SECONDS
          sudo -E env "PATH=$PATH" .venv/bin/pytest harness/tests/integration -q -p no:cacheprovider -rs
          echo "fake-e2e on ubuntu-24.04: $((SECONDS - start)) s wall time, image builds included (budget B-CI-E2E: 120 s, a target)" >> "$GITHUB_STEP_SUMMARY"
      - name: wall time to the job summary
        if: always()
        run: |
          echo "fake-e2e: $(( $(date +%s) - JOB_START )) s wall time on ubuntu-24.04, one run (hard limit 4 min, twice B-CI-E2E, 2 min)" >> "$GITHUB_STEP_SUMMARY"
