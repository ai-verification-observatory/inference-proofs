name: System inclusion
description: Ask for a prover system to be measured (RFC-0001 §Adding and removing a system).
title: "System inclusion: <system name>"
labels: ["system-inclusion"]
body:
  - type: markdown
    attributes:
      value: |
        A system is measured only with its team's consent (RFC-0001 INV-GOV-5). Read the adapter guide, `systems/README.md`, first. Silence is never recorded as consent.
  - type: input
    id: repository
    attributes:
      label: Upstream repository
      description: The public repository of the system, for example https://github.com/<owner>/<repo>.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Full commit hash
      description: The 40-character lowercase hexadecimal commit to pin. A tag or branch is not enough.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: textarea
    id: workloads
    attributes:
      label: Supported workloads
      description: The models, precisions and shapes the system supports at that commit, with links to its documentation.
    validations:
      required: true
  - type: textarea
    id: maintainers
    attributes:
      label: System maintainers
      description: At least one person who will own the adapter, claim card and row review. One per line, handle and organisation.
      placeholder: "handle, organisation"
    validations:
      required: true
  - type: textarea
    id: consent
    attributes:
      label: Consent
      description: A comment on this issue by a person listed as an author or maintainer upstream at the pinned commit, or a link to a public statement. A contributor filing for a team links the team's written consent here.
    validations:
      required: true
