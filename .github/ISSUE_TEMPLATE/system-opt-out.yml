name: System opt-out
description: Withdraw a system from future measurement (RFC-0001 §Adding and removing a system).
title: "System opt-out: <system name>"
labels: ["system-opt-out"]
body:
  - type: markdown
    attributes:
      value: |
        A team may opt out at any time. The effect:
        - No new runs of the system are accepted.
        - Existing runs stay in `results/`, which is append-only.
        - The system leaves the next release's index, and that release's report states that the team opted out and when.
        - Already published releases are not edited.
  - type: input
    id: system
    attributes:
      label: System
      description: The system id under `systems/`.
    validations:
      required: true
  - type: textarea
    id: requester
    attributes:
      label: Who asks
      description: Your handle and organisation, and how you are listed upstream as an author or maintainer.
    validations:
      required: true
