[project]
name = "inference-proofs-harness"
version = "0.1.0.dev0"
description = "Harness for an open, neutral benchmark of provable inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
    "Jinja2>=3.1.4,<4",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.560,<13"]
fetch = ["huggingface_hub>=0.26,<1"]
prompts = ["tokenizers>=0.20,<1"]

[project.scripts]
iproofs = "iproofs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/src/iproofs"]

[tool.hatch.build.targets.sdist]
include = ["harness/src/iproofs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["harness/tests", "systems"]
# shared test helpers such as toy_tokenizer.py
pythonpath = ["harness/tests"]
addopts = "-ra --strict-markers -p quarantine_plugin"
markers = [
  "quarantine(issue): a test that fails intermittently, run but not blocking; needs an issue number (docs/spec/07)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["harness/src", "harness/tests", "systems"]
# Python only: Python blocks inside the Markdown specs are illustrations, not code.
include = ["*.py", "*.pyi"]
# Known-bad gate fixtures are linted only by the tests that point at them.
extend-exclude = ["harness/tests/fixtures/gates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# RFC signatures pass several keyword-only fields (RFC-0010 IProofsError, Failure).
max-args = 8

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "harness/src"

[[tool.mypy.overrides]]
# Optional extras (INV-ARCH-6) are absent from the base install that CI type-checks.
module = ["tokenizers", "pynvml", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
