<!doctype html><html lang="en" data-w="180" data-h="180" data-scale="1"><head><meta charset="utf-8"><title>icon card</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=block" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:180px;height:180px;overflow:hidden;background:#0b0b0c;color:#f1efe9;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}
.disp{font-family:"Archivo",sans-serif;font-stretch:66%;font-weight:900}
.sl.yes{fill:#7cf29a}.sl.partly{fill:#e89400}.sl.no{fill:#e8332a}
.sl.unstated{fill:#0b0b0c;stroke:#6f6a62;stroke-width:1.2}
.pie-svg{display:block;overflow:visible}
.kmini path{fill:transparent;stroke:#0b0b0c;stroke-width:1.8;stroke-linejoin:round}.kmini path.on{fill:#f1efe9;stroke-width:2.2}
.sw{display:inline-block;width:.62em;height:.62em;margin-right:.32em;vertical-align:.02em}
.sw.yes{background:#7cf29a}.sw.partly{background:#e89400}.sw.no{background:#e8332a}.sw.unstated{box-shadow:inset 0 0 0 2px #6f6a62}
</style></head><body><img src="icon.svg" width="180" height="180" alt="" style="display:block"></body></html>
