publisher:
  name: "Meta"
  release: {hub: "huggingface", repo: "meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8", revision: "94125d2bd83076b21eed33119525e29eaf3894f4", gated: true}
precision:
  name: "FP8"
  statement: "compressed-tensors, float-quantized: Linear layers with FP8 weights (8-bit float, one scale per output channel, static) and FP8 input activations quantized per token at run time; not quantized (left in the model dtype, bfloat16): lm_head, every self-attention projection, the router, the shared expert and the dense feed-forward layers of the language model, and the vision model and projector. KV cache scheme: none."
  release_statement: {quote: "the Llama 4 Maverick model is released as both BF16 and FP8 quantized weights. The FP8 quantized weights fit on a single H100 DGX host while still maintaining quality.", url: "https://huggingface.co/meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8/blob/94125d2bd83076b21eed33119525e29eaf3894f4/README.md"}
