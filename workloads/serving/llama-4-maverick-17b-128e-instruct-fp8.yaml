# RFC-0015 SRV-6 (owner decision of 2026-11-09): the production-serving weights of the Llama 4
# Maverick workloads, Meta's FP8 release. Meta's repository is gated; RedHatAI's copy is not,
# and every pinned file has the same git blob id in both at the pinned revisions (RFC-0014 SM-1
# to SM-3; Hub tree listings read 2026-11-09). The copy lacks Meta's tokenizer_config.json and
# chat_template.jinja; tokenizer_config.json waits for RFC-0015 Q7. special_tokens_map.json is
# left out: Meta's file (blob d2b717ab, the same in both repositories) is not valid JSON (a
# trailing comma before its closing brace), and without tokenizer_config.json the pinned
# engine's transformers reads it and fails to load the tokenizer (RFC-0015 Q7). Every pinned
# file is still Meta's bytes; the prompts are token ids, so no special token is looked up by
# name (SRV-2). The file list, digest,
# vocab_size and shape are written by `iproofs serving pin`, never typed. tokenizer.json has the
# sha256 the Maverick workloads pin as tokenizer_source, so the prompts' token ids are this
# release's. The precision statement is copied from the release's config.json
# quantization_config and recipe.yaml (blob ids equal to Meta's); the release statement is
# Meta's model card at the pinned revision.
