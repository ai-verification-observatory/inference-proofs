# SASH zk-inference-prover (RFC-0005). Values and their upstream sources: systems/sash/README.md.
# RFC-0014 B7: built by the images workflow from the efficiency branch at
# aa5f31f97e76eccb77c7a52fcc54cbe9b8109dcb (adapter_dirty false) and pushed to the project registry.
schema: "system/1"
name: "sash"
kind: "prover"
contract: "adapter/1"
upstream:
  repo: "sg-ai-safety-hub/zk-inference-prover"
  url: "https://github.com/sg-ai-safety-hub/zk-inference-prover"
  commit: "4f41667297430a598165c4a8604258fe37d952ae"
image:
  repository: "ghcr.io/ai-verification-observatory/sash"
  digest: "sha256:14defac4f5635bf2665b9f320e81c1ad0b6c6512b644565e7b7a9c189d84d3a5"
# l1-l31-8b-p512-o512 (RFC-0018 Level 1): 512 + 512, five requests a session, one grid of two
# blocks per request; README.md §Level 1 has the geometry and the open items.
workloads: ["sash-l31-8b-c4096", "sash-l31-8b-c1024", "l1-l31-8b-p512-o512", "dev-l31-8b-toc-p512-o512"]
profile: "prover-h100"
deterministic_proofs: true
# a job proves its requests one after another and releases each grid as it completes: 5 proofs
# a job at Level 1, one at v0.1 (where one release leaves the steady scope unobservable anyway)
incremental_proofs: true
proofs:
  granularity: "segment_grid"
  tokens_covered: "prompt_plus_output"
  steady_boundary: "first_proof"
  steady_approximate: false
  # RFC-0008 §Parts the verifier reads: boundary-grid reads plan.txt and every segment's three
  # files (README.md §Values for system.yaml)
  verify_reads: "all"
forbidden_flags: ["--unsound-skip-", "--unsound-argmax-lax"]
# RFC-0005 timeouts are limits. verify above the 3,600 s default: on the H100 host, boundary-grid
# --verify of one sash-l31-8b-c1024 grid took 3,381 s at about 3.9 CPUs (a development call), and
# the harness also times it on one CPU (verify.single_thread). A job that hit 3,600 s failed.
timeouts_s: {verify: 21600}
