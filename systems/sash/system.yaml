# SASH zk-inference-prover (RFC-0005). Values and their upstream sources: systems/sash/README.md.
# RFC-0001 §System inclusion: no SASH team member has been reached yet, so `maintainers` is empty
# and no consent is recorded. Rows carry the note "system maintainers not reached" and the claim
# card stays unreviewed until a system maintainer is named; silence is never consent.
# RFC-0014 B7: built by the images workflow from main at aa3fbb2cd5f9f53fadf7966f02784492aaca5392
# (adapter_dirty false) and pushed to the project registry.
schema: "system/1"
name: "sash"
kind: "prover"
contract: "adapter/1"
upstream:
  repo: "sg-ai-safety-hub/zk-inference-prover"
  url: "https://github.com/sg-ai-safety-hub/zk-inference-prover"
  commit: "eb95bfa887299d1637550228d42086c27cbb2b3b"
image:
  repository: "ghcr.io/ai-verification-observatory/sash"
  digest: "sha256:bf548d5666b10d653babb23612d670dfa7c86f7b75f3784da0451d53ec90f577"
maintainers: []
workloads: ["sash-l31-8b-c4096", "sash-l31-8b-c1024"]
profile: "prover-h100"
deterministic_proofs: true
incremental_proofs: false
proofs: {granularity: "segment_grid", tokens_covered: "prompt_plus_output", steady_boundary: "not_observable", steady_approximate: false}
forbidden_flags: ["--unsound-skip-", "--unsound-argmax-lax"]
# RFC-0005 timeouts are limits. verify above the 3,600 s default: on the H100 host, boundary-grid
# --verify of one sash-l31-8b-c1024 grid took 3,381 s at about 3.9 CPUs (a development call), and
# the harness also times it on one CPU (verify.single_thread). A job that hit 3,600 s failed.
timeouts_s: {verify: 21600}
