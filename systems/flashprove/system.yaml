# FlashProve (RFC-0005). Values and their upstream sources: systems/flashprove/README.md.
# RFC-0014 B7: built by the images workflow from main at 4f1a295e06d52e0e3484f3c88005a1dcdcbd59fb
# (adapter_dirty false) and pushed to the project registry.
schema: "system/1"
name: "flashprove"
kind: "prover"
contract: "adapter/1"
upstream:
  repo: "anthropics/FlashProve"
  url: "https://github.com/anthropics/FlashProve"
  commit: "9e2bdd8ff5bf9c62f18263d7dac189b0400b260c"
image:
  repository: "ghcr.io/ai-verification-observatory/flashprove"
  digest: "sha256:7ca6c9ee8c6568b9b925a5c8a8d8eb2f3cd7e394b0f047cde3096d99145a91f8"
# l1-maverick-p512-o512 (RFC-0018 Level 1): 512 + 512, batch 24, five batches a session. Batch 24
# is the publisher's headline timed run: guide/performance.md L8-L12 and docs/figures.tsv L63
# ("Proving speed in steady service, 24 requests a batch") at 9e2bdd8. The batch size itself is
# in the workload's shape; README.md §Level 1 has the request, the range and the reply route.
workloads: ["fp-maverick-w1024-b1", "fp-maverick-w1024-b24", "l1-maverick-p512-o512"]
profile: "prover-h100"
deterministic_proofs: false
incremental_proofs: true
proofs:
  granularity: "request"
  tokens_covered: "window"
  steady_boundary: "first_proof"
  steady_approximate: true
  # RFC-0008 §Parts the verifier reads; why: README.md §Values for system.yaml
  verify_reads:
    read: ["response.proof"]
    not_read:
      - part: "response.y"
        reason: "verify never reads it: cp_verify checks a token file the adapter writes from the job's claimed_output, which the harness takes from its own record (AGENTS.md rule 6); C1 changes that token"
forbidden_flags: ["-public-weights", "-keep-for-the-audit"]
