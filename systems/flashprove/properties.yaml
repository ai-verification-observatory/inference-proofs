          prover_run: {value: "tested", quotes: [{text: "| The C++ and CUDA programs | nothing: not proved; tested |", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L21"}]}
        completeness:
          protocol: {value: "machine_checked", quotes: [{text: "In one line: proved in Lean for the protocol, on served requests, at the exact-match policy", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L149"}]}
          verifier_run: {value: "tested", quotes: [{text: "In the code both are tested, not verified", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L24"}]}
          prover_run: {value: "tested", quotes: [{text: "In the code both are tested, not verified", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L24"}]}
  weights_hidden:
    sources_read: ["README.md", "guide/weight-hiding.md", "docs/what-is-not-hidden.md"]
    hiding:
      stated:
        value: true
        quotes: [{text: "Zero knowledge, Lean's form of weight hiding, is proved in Lean for the protocol, at [full size](terms.md) and at the exact-match policy, with fresh random masks.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]
      verifier_gets_weights:
        value: false
        quotes: [{text: "Anyone can check the proof on an ordinary CPU in seconds with `cp_verify`, without the weights.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L15-L16"}]
      proof:
        value: "protocol"
        quotes: [{text: "batches, which are what the programs serve, are not covered", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L5"}]
      programs:
        value: "not_stated"
        quotes:
          - {text: "we expect, rather than know, that the programs hide the weights at the default setting, in honest runs, if the provider keeps its duties (this does not reach any real model's weights, or the parameter file and scales fitted to them", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}
          - {text: "Anything else is outside it, and so is any real model, the example's too, because it needs a parameter file fitted to it", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L37"}
        note: "the publisher expects the programs to hide the weights, but says the expectation does not reach a real model's weights or the files fitted to them; the row commits a real model's weights"
      visible_listed:
        value: true
        quotes: [{text: "At least eleven things are visible", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L5"}]
      visible:   # item = the heading without markup; quotes = the heading verbatim (+ the sentence that ties it to the weights)
        - {item: "Each reply.", tag: "statement_io", quotes: [{text: "**Each reply.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L53"}]}
        - {item: "Whether a request was served or failed.", tag: "statement_io", quotes: [{text: "**Whether a request was served or failed.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L58"}]}
        - {item: "Time.", tag: "side_channel", quotes: [{text: "**Time.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L64"}]}
        - {item: "The architecture and every size.", tag: "shape", quotes: [{text: "**The architecture and every size.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L72"}]}
        - {item: "Settings fitted to the weights.", tag: "fitted_to_weights", quotes: [{text: "**Settings fitted to the weights.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L74"}, {text: "Two sets of public values are computed from the weights and a calibration set.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L74"}]}
        - {item: "That cp_commit's checks passed.", tag: "fitted_to_weights", quotes: [{text: "**That `cp_commit`'s checks passed.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L80"}, {text: "So it says that every weight outside the embedding lies in its declared range", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L80"}]}
        - {item: "That a batch failed or the service stopped.", tag: "side_channel", quotes: [{text: "**That a batch failed or the service stopped.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L84"}]}
        - {item: "How much a provider has served, and when.", tag: "side_channel", quotes: [{text: "**How much a provider has served, and when.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L92"}]}
        - {item: "Who shared a batch, and how many.", tag: "side_channel", quotes: [{text: "**Who shared a batch, and how many.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L97"}]}
        - {item: "Lengths, places in the batch and nonces.", tag: "side_channel", quotes: [{text: "**Lengths, places in the batch and nonces.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L99"}]}
        - {item: "Masked sums of the weights, public for good.", tag: "fitted_to_weights", quotes: [{text: "**Masked sums of the weights, public for good.**", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L102"}, {text: "`cp_commit` publishes, for each row of each weight table, a sum of the row's weights with public factors.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/docs/what-is-not-hidden.md#L102"}]}
  no_trusted_party:
    sources_read: ["README.md", "guide/what-is-proved.md", "lean/THEOREM.md"]
    trust:
      rests_on:
        value: "transparent"
        quotes:
          - {text: "Six theorems are proved in Lean of one committer, prover and verifier, `compile (flashProve setup)`, at every public setup `setup` (`PublicSetup`: three public files, what the reader returns at them, and `FilesInUse`).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L3-L5"}
          - {text: "`Sound` says that there is one extractor such that, whatever the committer and the prover, `verify` accepts a false claim with probability at most the bound at q = a + b.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L276-L277"}
          - {text: "public files that are fixed before the hash function is sampled (a provider that tunes them to the real hash function is outside the statement)", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L149-L150"}
          - {text: "the soundness theorem on `verify` has no hypothesis beyond those in its statement, so nothing more is assumed by that road.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L413-L414"}
          - {text: "**The random-oracle model** for the hash, with a second, fixed hash function, built on BLAKE2b's compression function, assumed independent of it, against classical adversaries.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L57-L58"}
          - {text: "the random oracle and the second hash function belong to the statement, not to the proof's axioms.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L159-L160"}
        note: "our reading: the publisher states soundness at a public setup of three public files, against any committer and prover; no sentence says in words that no setup produced a secret"
      publicly_checkable:
        value: true
        quotes: [{text: "Anyone can check the proof on an ordinary CPU in seconds with `cp_verify`, without the weights.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L15-L16"}]
