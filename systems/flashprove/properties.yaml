# Statement facts of FlashProve's glyph (RFC-0018 GL-1), copied from the documentation at the pin for the
# configuration the row runs (cp_verify at exact match, claim.yaml). No state is typed: iproofs.glyph computes
# each petal. Read by the integrator on 2026-11-13; not reviewed by FlashProve's maintainers. Values with a
# `note` are the reader's reading, not words of the publisher (RFC-0018 §Conflicts of Interest).
schema: "properties/2"
system: "flashprove"
configuration: "exact-match-cp-verify"
upstream: {repo: "anthropics/FlashProve", commit: "9e2bdd8ff5bf9c62f18263d7dac189b0400b260c"}
read: "2026-11-13"
petals:
  unforgeable:
    sources_read: ["README.md", "guide/what-is-proved.md", "lean/THEOREM.md", "guide/known-limits.md"]
    bound:
      stated:
        value: true
        quotes:
          - text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")"
            url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"
      expression:
        value: "q/2^124 + 2^-101"
        quotes:
          - text: "The Lean verifier accepts a proof of a false claim with probability at most about q/2^124 + 2^-101 after q hash queries (about 124 bits per query; not \"128 bits\")"
            url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L46-L47"
      terms: [124, 101]
      basis:
        value: "proved"
        quotes: [{text: "Lean's kernel has checked the proof.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L51"}]
      unit:
        value: "proof"
        quotes:
          - {text: "The bound is for one commitment, one prompt, one output, one proof and one call of `verify`.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L150-L151"}
          - {text: "**One proof.** N proofs handed in at once under one commitment, or N members of a batch, cost N times that error, taken at the whole list's hash queries; for proofs checked one after another, or members checked in separate sessions, no bound is stated.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L66-L68"}
      batch:
        value: "together"
        quotes:
          - {text: "**One proof.** N proofs handed in at once under one commitment, or N members of a batch, cost N times that error, taken at the whole list's hash queries; for proofs checked one after another, or members checked in separate sessions, no bound is stated.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L66-L68"}
          - {text: "for separate sessions no theorem states it.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L373"}
      adversary:
        value: "any_prover"
        quotes:
          - {text: "against a committer and a prover who may both cheat", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L142"}
          - {text: "so nothing is claimed against a quantum adversary", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L394-L395"}
        note: "classical adversaries only (THEOREM.md L394-L395); the files-fixed-before-the-hash condition is counted under conditions_shown"
      parameters:
        value: "row"
        quotes:
          - {text: "**One proof format and model size:** full size, not the small examples", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L62"}
          - {text: "Neither figure, 124 bits per query or 128 bits per round, is claimed for the C++ programs.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L70"}
        note: "the row runs the full-size format at exact match; whether its own files are in scope is conditions_shown; the bound is stated for the Lean verifier and not claimed for cp_verify, which the row runs (bound.program)"
      conditions_shown:
        value: false
        quotes:
          - {text: "At all other files in scope nothing is known, so there the theorem may hold only because `verify` rejects everything.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L314-L315"}
          - {text: "The proofs from the runs on real weights were checked by `cp_verify` alone; none has been put to the Lean verifier", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L227-L228"}
          - {text: "public files that are fixed before the hash function is sampled (a provider that tunes them to the real hash function is outside the statement)", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L149-L150"}
          - {text: "No file shows that they were fixed before the provider could tune them to the hash function: that you grant.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L288-L289"}
      program:
        value: "not_stated"
        quotes:
          - {text: "Neither figure, 124 bits per query or 128 bits per round, is claimed for the C++ programs.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L70"}
          - {text: "The C++ verifier and the CUDA prover are written to follow the same protocol and are tested against it, not themselves proved.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L7-L8"}
          - {text: "The C++ programs' printed \"bits\" are their own accounting, not a theorem", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/known-limits.md#L65-L66"}
  machine_checked:
    sources_read: ["README.md", "guide/what-is-proved.md", "guide/weight-hiding.md", "lean/THEOREM.md"]
    formal:
      reach:
        value: "protocol_and_statement"
        quotes:
          - {text: "**Soundness** is proved, in Lean, for the verifier written in Lean", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L3"}
          - {text: "At each position it is the greedy next token after the prompt and the output's own earlier tokens, as an integer program computes it, not the floating-point model.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L231-L233"}
          - {text: "That this interactive oracle proof is the protocol of the C++ programs is not proved", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L267-L268"}
          - {text: "Scale files in scope can switch off any of the model's blocks, up to all of them (worked out by hand, not proved).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L229-L231"}
          - {text: "No theorem describes the five constant look-up tables in the Lean text (cosine, sine, the exponential, SiLU and the sigmoid).", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L242-L243"}
          - {text: "the kernel checks proofs, not what a definition means", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L83"}
        note: "the theorem covers the Lean protocol and states the model as an integer program (THEOREM.md L231-233); the C++ verifier the row runs is tested, not proved (what-is-proved.md L7-8), so the reach stops short of verifier_run; the model statement is the publisher's Lean integer model, and its tables and its reach at a given scale file are not proved (THEOREM.md L229-L231, L242-L243)"
      tool:
        value: "Lean 4, kernel 4.29.1"
        quotes:
          - {text: "The protocol's soundness is proved in Lean 4.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/README.md#L26"}
          - {text: "the pinned version, 4.29.1, is older than fixes of publicly known soundness bugs in it", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L382-L383"}
      toolchain:
        value: {name: "leanprover/lean4", version: "v4.29.1"}
        quotes: [{text: "leanprover/lean4:v4.29.1", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/lean-toolchain#L1"}]
      theorem: "VerifierAndGoals.AtTheName.sound_of_verify_at"
      theorem_url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/Johnson/Goal/Skeleton/SoundOfVerifyAt.lean#L69"
      trusted_base:
        value: ["Lean's kernel", "propext", "Classical.choice", "Quot.sound"]
        quotes: [{text: "**Lean's kernel and three standard axioms:** `propext`, `Classical.choice`, `Quot.sound`.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L381"}]
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      input_code_unverified:
        value: true
        quotes: [{text: "Five of the files that this function takes come from a parser outside Lean, of which nothing is proved", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/lean/THEOREM.md#L64-L65"}]
      scope_card:
        soundness:
          protocol: {value: "machine_checked", quotes: [{text: "**Soundness** is proved, in Lean, for the verifier written in Lean", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L3"}]}
          verifier_run: {value: "tested", quotes: [{text: "The C++ verifier and the CUDA prover are written to follow the same protocol and are tested against it, not themselves proved.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L7-L8"}]}
          prover_run: {value: "tested", quotes: [{text: "The C++ verifier and the CUDA prover are written to follow the same protocol and are tested against it, not themselves proved.", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/what-is-proved.md#L7-L8"}]}
        zero_knowledge:
          protocol: {value: "machine_checked", quotes: [{text: "Zero knowledge, Lean's form of weight hiding, is proved in Lean for the protocol", url: "https://github.com/anthropics/FlashProve/blob/9e2bdd8ff5bf9c62f18263d7dac189b0400b260c/guide/weight-hiding.md#L3"}]}
