# RFC-0018 FI-1, FI-2, FI-7: the fidelity reference, llama.cpp at the level's pinned commit,
# built from source in this image (Dockerfile). It is a reference job, not a row: `iproofs
# fidelity run` drives it (info, then one prove call per model source) and never runs commit or
# verify. Each entry is a rung's workload and the precision the reference runs it at (the
# publisher's 16-bit release, FI-1). The llama.cpp options are fixed in the entrypoint, the same
# for every rung, and documented in systems/ref-fidelity/README.md; engine_args stays empty.
schema: system/1
name: ref-fidelity
kind: reference
contract: adapter/1
reference_role: fidelity
engine:
  name: llama.cpp
  version: v0.9.0
  commit: cd959bae99ff4bed22bef2604f45241c09bbb8c8
  # The CUDA image the engine is compiled in (the build stage); the runtime stage is the same
  # release's runtime image. Both by digest in the Dockerfile.
  image: docker.io/nvidia/cuda@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
# RFC-0014 B7: built by the images workflow (run 43233789681) from the fidelity-vllm branch at
# fb8bc9c5953d2c422c9ee03a837edeaa1b3108b3 (adapter_dirty false), with the controls call (FI-9).
# The Llama 3.1 8B fidelity run of 2026-11-12 ran the previous build, sha256:551f1175..., from
# aa5f31f9, whose entrypoint differs only by that call.
image:
  repository: "ghcr.io/ai-verification-observatory/ref-fidelity"
  digest: "sha256:4de61052db8fc85f713c0ec37e5e04e5510aed6eb5558b30412e736f0ef7091c"
workloads:
- id: l1-maverick-p512-o512
  precision_used: BF16
  precision_substitution: null
  engine_args: []
- id: l1-l31-8b-p512-o512
  precision_used: BF16
  precision_substitution: null
  engine_args: []
- id: l1-gpt2-p512-o512
  precision_used: FP32
  precision_substitution: null
  engine_args: []
deterministic_proofs: true
incremental_proofs: false
forbidden_flags: []
