# RFC-0018 FI-1, FI-2, FI-7: the fidelity reference, llama.cpp at the level's pinned commit,
# built from source in this image (Dockerfile). It is a reference job, not a row: `iproofs
# fidelity run` drives it (info, then one prove call per model source) and never runs commit or
# verify. Each entry is a rung's workload and the precision the reference runs it at (the
# publisher's 16-bit release, FI-1). The llama.cpp options are fixed in the entrypoint, the same
# for every rung, and documented in systems/ref-fidelity/README.md; engine_args stays empty.
schema: system/1
name: ref-fidelity
kind: reference
contract: adapter/1
reference_role: fidelity
engine:
  name: llama.cpp
  version: v0.9.0
  commit: cd959bae99ff4bed22bef2604f45241c09bbb8c8
  # The CUDA image the engine is compiled in (the build stage); the runtime stage is the same
  # release's runtime image. Both by digest in the Dockerfile.
  image: docker.io/nvidia/cuda@sha256:520292dbb4f755fd360766059e62956e9379485d9e073bbd2f6e3c20c270ed66
# RFC-0014 B7: built by the images workflow (run 43453873438) from the teacher-forced branch at
# fb54cdd6e6b555238d2e4833cbf2b4fe36238295 (adapter_dirty false), with the teacher-forced pass
# (RFC-0018 FI-10 to FI-13). The Llama 3.1 8B fidelity run of 2026-11-12 ran sha256:551f1175...,
# from aa5f31f9, and the Llama 4 Maverick controls part sha256:4de61052..., from fb8bc9c5; their
# entrypoints differ from this one only by the controls call (FI-9) and that pass.
# The Llama 4 Maverick teacher-forced controls of 2026-11-13 ran the build below: the one above
# (sha256:b91682f5..., which the 8B passes ran) with the entrypoint of b0cafa57 over it
# (Dockerfile.adapter, run 43515577499), which writes each prompt of a pass as it finishes.
# Maverick's Q8_0 and Q4_K_M teacher-forced passes of 2026-11-13 ran sha256:5a65ddf7... (the
# entrypoint of b0cafa57). The build below adds the entrypoint of 973a1015 over the same base
# (Dockerfile.adapter, run 43632507695): a teacher-forced pass may start llama-server with
# --swa-full, which the Q3_K_S and Q2_K passes use.
image:
  repository: "ghcr.io/ai-verification-observatory/ref-fidelity"
  digest: "sha256:fe1c5421e0943b4793be8a00ed47251c3c08a4da34ffa98e8b3f832cea0e6c7c"
