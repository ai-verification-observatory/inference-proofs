# RFC-0015 reference system: production serving (SRV-1 to SRV-10, owner decision of 2026-11-09).
# Engine pin: RFC-0015 Q1 (#136). Each entry is one serving configuration, keyed by workload, load
# point and GPU count; engine_args are the SRV-3 allowlist only (the engine's defaults otherwise),
# and the weights are the serving record that names the workload (workloads/serving/). Options and
# their documentation links: systems/ref-serve/README.md.
schema: system/1
name: ref-serve
kind: reference
contract: adapter/1
reference_role: serve
engine:
