  commit: 5df63a7203cdb9328d824a27b682e77c7b9928be  # the image ENV VLLM_BUILD_COMMIT (Q1)
# RFC-0014 B7: built by the images workflow from main at 2dacdc85e9871460b82ecc939340c2f988b68338
