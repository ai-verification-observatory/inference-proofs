# A system-controls/1 fixture for the fake systems (RFC-0008 §System-specific controls): one
# control of each kind. The fake's `--unsound-skip-tag` marks the binding report's tag edge
# unbound; any other skip leaves it bound.
schema: "system-controls/1"
controls:
  - id: "fake-unsound-skip-tag"
    kind: "weakened_prover"
    description: "the tag skip, honestly reported as an unbound edge"
    control_flags: ["--unsound-skip-tag"]
    expected: ["accepted"]
    requires_unbound_edge: "tag"
  - id: "fake-unsound-skip-nothing"
    kind: "weakened_prover"
    description: "a skip that unbinds nothing: accepted, but the edge stays bound"
    control_flags: ["--unsound-skip-nothing"]
    expected: ["accepted"]
    requires_unbound_edge: "tag"
  - id: "fake-fixture-proof"
    kind: "fixture_proof"
    description: "an upstream-supplied proof, verified as is"
    source: "https://github.com/ai-verification-observatory/inference-proofs/tree/64168df9fd0706dfd955b6795fa6f535872dff78/systems/fake"
    expected: ["rejected"]
